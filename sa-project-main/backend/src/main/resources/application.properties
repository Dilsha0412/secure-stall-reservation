# Application Configuration
spring.application.name=bookfair-app
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bookfair_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Token Security Properties
jwt.secret=bookfairsecretkeybookfairsecretkeybookfairsecretkey
jwt.expiration=86400000

# Cloud OIDC Identity Provider (Auth0 / Asgardeo / Okta) Configuration
oidc.enabled=true
oidc.issuer-uri=https://dev-bookfair.us.auth0.com/
oidc.client-id=bookfair-app-client-id
oidc.client-secret=bookfair-app-client-secret
oidc.logout-url=https://dev-bookfair.us.auth0.com/v2/logout
oidc.redirect-uri=http://localhost:3000/login

# HTTPS SSL Configuration (Enable by setting server.ssl.enabled=true)
server.ssl.enabled=false
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=bookfairpass
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bookfair

# Mail Notification Properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=leadsyntax@gmail.com
spring.mail.password=change-this-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
